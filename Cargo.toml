[package]
name = "shiyin-rs"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
description = "Shiyin local music player for Windows"
readme = "README.md"
license = "MIT"
repository = "https://github.com/aFunnyStrange/local_music_player"
publish = false

[[bin]]
name = "shiyin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts"] }
encoding_rs = "0.8"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
libloading = "0.8"
rand = "0.9"
raw-window-handle = "0.6"
regex = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tray-icon = "0.19"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
winresource = "0.1"
