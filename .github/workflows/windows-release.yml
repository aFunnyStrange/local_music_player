name: Windows build
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['backup/**']
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare pinned Rust and VLC runtime
        shell: powershell
        run: ./scripts/setup.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check tag matches release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $expected = 'v' + ($metadata.packages | Where-Object name -eq 'shiyin-rs').version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw 'Tag and build version differ' }
      - name: Build and verify executable
        shell: powershell
        run: ./scripts/build_release.ps1
      - name: Collect third-party sources
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/build_sources.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.sha256
            dist/verification.json
            docs/releases/*.md
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: artifacts
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts/dist
          sha256sum --check *.sha256
          gh release create "$RELEASE_TAG" *.zip *.sha256 verification.json --verify-tag --title "Shiyin $RELEASE_TAG" --notes-file "../docs/releases/${RELEASE_TAG#v}.md"
